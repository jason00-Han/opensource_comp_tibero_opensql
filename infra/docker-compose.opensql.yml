services:
  opensql:
    build:
      context: ./opensql
      args:
        OPENSQL_BASE_IMAGE: ${OPENSQL_BASE_IMAGE:-opensql-systemd-ready:latest}
    image: tibero-doc-opensql:dev
    environment:
      OPENSQL_POSTGRES_PASSWORD: ${OPENSQL_POSTGRES_PASSWORD:?set OPENSQL_POSTGRES_PASSWORD}
      OPENSQL_REPLICATION_PASSWORD: ${OPENSQL_REPLICATION_PASSWORD:?set OPENSQL_REPLICATION_PASSWORD}
      OPENSQL_REWIND_PASSWORD: ${OPENSQL_REWIND_PASSWORD:?set OPENSQL_REWIND_PASSWORD}
      OPENSQL_LICENSE_SOURCE: /run/secrets/opensql-license.xml
    volumes:
      - opensql-postgres-data:/home/opensql/data/pgsql
      - opensql-etcd-data:/home/opensql/etc/etcd/etcd_data
      - opensql-logs:/home/opensql/logs
      - ${OPENSQL_LICENSE_FILE:?set OPENSQL_LICENSE_FILE}:/run/secrets/opensql-license.xml:ro
    ports:
      - "${OPENSQL_POSTGRES_PORT:-15432}:5432"
      - "${OPENSQL_PROXY_PORT:-16432}:6432"
      - "${OPENSQL_PATRONI_PORT:-18008}:8008"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    shm_size: 1gb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$${OPENSQL_POSTGRES_PASSWORD} /home/opensql/bin/psql -h 127.0.0.1 -p 6432 -U postgres -d opensql -Atc 'select 1' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  opensql-postgres-data:
  opensql-etcd-data:
  opensql-logs:
