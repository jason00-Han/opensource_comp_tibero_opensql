services:
  api:
    build: ..
    environment: &app-env
      TIBERO_DOC_DSN: ${TIBERO_DOC_DSN:?required}
      AUTH_MODE: required
      PIPELINE_MODE: queue
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      PATRONI_API_URLS: ${PATRONI_API_URLS:-}
      WORKER_METRICS_PORT: 9100
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      OBJECT_STORAGE: minio
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?required}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?required}
      S3_BUCKET: tibero-documents
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@localhost}
    depends_on: [redis, rabbitmq, minio]
    deploy:
      replicas: 3
    restart: unless-stopped

  ingest-worker:
    build: ..
    command: python -m workers.ingest.main
    environment: *app-env
    depends_on: [rabbitmq, minio]
    restart: unless-stopped
  embedding-worker:
    build: ..
    command: python -m workers.embedding.main
    environment: *app-env
    depends_on: [rabbitmq, minio]
    restart: unless-stopped
  sync-worker:
    build: ..
    command: python -m workers.sync.main
    environment: *app-env
    depends_on: [rabbitmq, minio]
    restart: unless-stopped
  outbox-publisher:
    build: ..
    command: python -m workers.outbox
    environment: *app-env
    depends_on: [rabbitmq]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/tibero-doc.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [api]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
  rabbitmq:
    image: rabbitmq:4-management
    ports: ["15672:15672", "15692:15692"]
    volumes: ["rabbitmq-data:/var/lib/rabbitmq"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes: ["minio-data:/data"]
  prometheus:
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    depends_on: [api, rabbitmq, loki]
  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/local-config.yaml
    ports: ["3100:3100"]
    volumes: ["loki-data:/loki"]
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on: [prometheus]
  airflow:
    image: apache/airflow:2.10.4-python3.12
    profiles: ["batch"]
    command: standalone
    environment:
      AIRFLOW_CONN_TIBERO_DOC_API: ${AIRFLOW_CONN_TIBERO_DOC_API:-http://api:8000}
      TIBERO_DOC_MAINTENANCE_TOKEN: ${TIBERO_DOC_MAINTENANCE_TOKEN:?required}
      TIBERO_DOC_DSN: ${TIBERO_DOC_DSN:?required}
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?required}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?required}
      S3_BUCKET: tibero-documents
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - ..:/opt/tibero-doc:ro
      - airflow-data:/opt/airflow
    ports: ["8080:8080"]
    depends_on: [api, minio]

volumes:
  redis-data:
  rabbitmq-data:
  minio-data:
  prometheus-data:
  grafana-data:
  airflow-data:
  loki-data:
