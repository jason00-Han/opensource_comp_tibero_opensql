global:
  scrape_interval: 15s
scrape_configs:
  - job_name: tibero-doc-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: tibero-doc-workers
    static_configs:
      - targets: ["ingest-worker:9100", "embedding-worker:9100", "sync-worker:9100", "outbox-publisher:9100"]
