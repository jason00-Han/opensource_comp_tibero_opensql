name: data-integration
on:
  push:
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e './services/api[test]'
      - run: pytest tests/unit services/api/tests -q
  integration:
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:4-management
        ports: ['5672:5672']
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 10
      minio:
        image: bitnami/minio:latest
        ports: ['9000:9000']
        env: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}
      postgres:
        image: pgvector/pgvector:pg16
        ports: ['5432:5432']
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: opensql}
        options: --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/%2F
      RUN_RABBITMQ_TESTS: '1'
      RUN_MINIO_TESTS: '1'
      S3_ENDPOINT_URL: http://127.0.0.1:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      OPENPROXY_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/opensql
      TIBERO_DOC_DSN: postgresql://postgres:postgres@127.0.0.1:5432/opensql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e './services/api[test]'
      - run: psql "$OPENPROXY_TEST_DSN" -f infra/opensql/init.sql
      - run: pytest tests/integration/rabbitmq tests/integration/storage tests/integration/database -q
