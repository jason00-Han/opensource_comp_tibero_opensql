[pytest]
testpaths = tests
markers =
    unit: fast test with no external service
    integration: component-boundary test
    e2e: complete document lifecycle test
    rabbitmq: requires RUN_RABBITMQ_TESTS=1 and a RabbitMQ broker
    openproxy: requires OPENPROXY_TEST_DSN and psycopg
    external_embedding: calls a configured real embedding endpoint
    mcp_http: requires RUN_MCP_HTTP_TESTS=1 and a local listen socket
addopts = --strict-markers
