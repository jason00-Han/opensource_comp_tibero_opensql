[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tibero-doc"
version = "0.1.0"
description = "CLI for the OpenSQL-based AI document platform"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "typer",
    "httpx",
    "rich",
    "keyring>=25,<26"
]

[project.scripts]
tibero-doc = "tibero_doc.main:app"

[tool.setuptools.packages.find]
where = ["src"]
