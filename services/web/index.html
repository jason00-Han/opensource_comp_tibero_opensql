<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tibero Doc</title><style>
:root{font-family:Inter,Pretendard,sans-serif;color:#17202a;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}.shell{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:24px;color:#132c59}.card{background:white;border:1px solid #e5e9f2;border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 8px 30px #20355a10}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}input,button,select{padding:11px 13px;border-radius:9px;border:1px solid #ccd4e0;font:inherit}button{background:#1d5ee8;color:white;border:0;font-weight:700;cursor:pointer}.muted{color:#6e7a8c}.result{padding:14px 0;border-bottom:1px solid #edf0f5}.hidden{display:none}.error{color:#c62828}.pill{padding:5px 9px;background:#eaf1ff;color:#174faa;border-radius:99px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="shell">
<header class="top"><div><div class="brand">Tibero Doc</div><div class="muted">OpenSQL 기반 안전한 AI 문서 검색</div></div><span id="identity" class="pill">로그인 필요</span></header>
<section id="login" class="card"><h2>로그인</h2><div class="grid"><input id="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"></div><button style="margin-top:12px" onclick="login()">로그인</button><p id="loginError" class="error"></p></section>
<div id="app" class="hidden"><section class="card"><h2>문서 검색</h2><div style="display:flex;gap:8px"><input id="query" style="flex:1" placeholder="찾고 싶은 내용을 자연어로 입력하세요"><button onclick="search()">검색</button></div><div id="results"></div></section>
<div class="grid"><section class="card"><h2>문서 업로드</h2><input id="file" type="file"><button onclick="upload()">업로드</button><p id="uploadState" class="muted"></p></section><section class="card"><h2>내 워크스페이스</h2><button onclick="loadDocuments()">문서 새로고침</button><div id="documents"></div></section></div></div>
</main><script>
const api='';let access=sessionStorage.getItem('access');const headers=()=>access?{'Authorization':'Bearer '+access}:{};
async function login(){const r=await fetch(api+'/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});if(!r.ok){loginError.textContent=(await r.json()).detail;return}const d=await r.json();access=d.access_token;sessionStorage.setItem('access',access);showApp()}
async function showApp(){const r=await fetch('/v1/me',{headers:headers()});if(!r.ok)return;const me=await r.json();identity.textContent=me.display_name+' · '+me.role;login.classList.add('hidden');app.classList.remove('hidden');loadDocuments()}
async function loadDocuments(){const r=await fetch('/v1/documents',{headers:headers()});const d=await r.json();documents.innerHTML=(d.documents||[]).map(x=>`<div class="result"><b>${esc(x.filename)}</b><br><span class="muted">v${x.version} · ${x.chunk_count} chunks</span></div>`).join('')||'<p class="muted">문서가 없습니다.</p>'}
async function upload(){const f=file.files[0];if(!f)return;const b=new FormData();b.append('file',f);uploadState.textContent='분석 중...';const r=await fetch('/v1/documents',{method:'POST',headers:headers(),body:b});uploadState.textContent=r.ok?'업로드 및 임베딩 완료':(await r.json()).detail;if(r.ok)loadDocuments()}
async function search(){const r=await fetch('/v1/search',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({query:query.value,mode:'hybrid',top_k:10})});const d=await r.json();results.innerHTML=(d.results||[]).map(x=>`<div class="result"><b>${esc(x.filename)}</b> <span class="pill">${x.score}</span><p>${esc(x.content)}</p></div>`).join('')||'<p class="muted">검색 결과가 없습니다.</p>'}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));if(access)showApp();
</script></body></html>
