[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tibero-doc-api"
version = "0.1.0"
description = "Local MVP API for the Tibero Doc platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "pika>=1.3,<2",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

packages = ["services", "services.api", "packages", "packages.core", "packages.core.pipeline", "workers", "workers.ingest", "workers.sync", "workers.embedding"]
package-dir = {"services" = "..", "services.api" = ".", "packages" = "../../packages", "packages.core" = "../../packages/core", "packages.core.pipeline" = "../../packages/core/pipeline", "workers" = "../../workers", "workers.ingest" = "../../workers/ingest", "workers.sync" = "../../workers/sync", "workers.embedding" = "../../workers/embedding"}

[tool.pytest.ini_options]
testpaths = ["tests"]