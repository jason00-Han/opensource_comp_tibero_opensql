[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tibero-doc-api"
version = "0.1.0"
description = "Local MVP API for the Tibero Doc platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.34,<1",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "pika>=1.3,<2",
    "httpx>=0.28,<1",
    "mcp>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "filelock>=3.16,<4",
    "boto3>=1.35,<2",
    "argon2-cffi>=23,<26",
    "redis>=5,<6",
    "jinja2>=3.1,<4",
    "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.setuptools]
packages = ["services", "services.api", "services.mcp_server", "packages", "packages.core", "packages.core.pipeline", "workers", "workers.ingest", "workers.sync", "workers.embedding"]
package-dir = {"services" = "..", "services.api" = ".", "services.mcp_server" = "../mcp_server", "packages" = "../../packages", "packages.core" = "../../packages/core", "packages.core.pipeline" = "../../packages/core/pipeline", "workers" = "../../workers", "workers.ingest" = "../../workers/ingest", "workers.sync" = "../../workers/sync", "workers.embedding" = "../../workers/embedding"}
